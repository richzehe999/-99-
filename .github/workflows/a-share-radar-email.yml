name: A股雷达邮件

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "报告模式"
        required: true
        default: "盘前交易"
        type: choice
        options:
          - 盘前交易
          - 售后市场

  schedule:
    # 北京时间 08:30 = UTC 00:30
    - cron: "30 0 * * 1-5"
    # 北京时间 16:30 = UTC 08:30
    - cron: "30 8 * * 1-5"

jobs:
  send:
    runs-on: ubuntu-latest

    env:
      A_SHARE_REPORT_TO: ${{ secrets.A_SHARE_REPORT_TO }}
      QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: 检查 Secrets
        run: |
          test -n "$A_SHARE_REPORT_TO" || (echo "缺少 A_SHARE_REPORT_TO" && exit 1)
          test -n "$QQ_SMTP_USER" || (echo "缺少 QQ_SMTP_USER" && exit 1)
          test -n "$QQ_SMTP_AUTH_CODE" || (echo "缺少 QQ_SMTP_AUTH_CODE" && exit 1)

      - name: 检查脚本
        run: |
          if [ ! -f scripts/cloud_a_share_radar_email.py ]; then
            echo "未找到 scripts/cloud_a_share_radar_email.py"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: 发送邮件
        run: python scripts/cloud_a_share_radar_email.py --mode premarket --send
