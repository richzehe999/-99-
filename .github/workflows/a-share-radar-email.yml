name: A股雷达邮件

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '报告模式'
        required: true
        default: '盘前'
        type: choice
        options:
          - 盘前
          - 盘后

  schedule:
    # 北京时间 08:30 = UTC 00:30 — 盘前
    - cron: '30 0 * * 1-5'
    # 北京时间 16:30 = UTC 08:30 — 盘后
    - cron: '30 8 * * 1-5'

jobs:
  send:
    runs-on: ubuntu-latest

    env:
      A_SHARE_REPORT_TO: ${{ secrets.A_SHARE_REPORT_TO }}
      QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确定运行模式
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ github.event.inputs.mode }}"
            if [[ "$INPUT" == "盘后" ]]; then
              echo "value=aftermarket" >> "$GITHUB_OUTPUT"
            else
              echo "value=premarket" >> "$GITHUB_OUTPUT"
            fi
          else
            HOUR=$(TZ='Asia/Shanghai' date +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "value=premarket" >> "$GITHUB_OUTPUT"
            else
              echo "value=aftermarket" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 发送 ${{ steps.mode.outputs.value }} 邮件
        run: python scripts/cloud_a_share_radar_email.py --mode ${{ steps.mode.outputs.value }} --send
