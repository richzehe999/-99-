name: A股雷达邮件

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "报告模式"
        required: true
        default: "premarket"
        type: choice
        options:
          - premarket
          - midday
          - aftermarket
  schedule:
    # 北京时间 08:10 = UTC 00:10，工作日盘前邮件
    - cron: "10 0 * * 1-5"
    # 北京时间 12:10 = UTC 04:10，工作日午间邮件
    - cron: "10 4 * * 1-5"
    # 北京时间 16:10 = UTC 08:10，工作日盘后邮件
    - cron: "10 8 * * 1-5"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A_SHARE_REPORT_TO: ${{ secrets.A_SHARE_REPORT_TO }}
      QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      SMTP_HOST: smtp.qq.com
      SMTP_PORTS: "465,587"
      PYTHONIOENCODING: utf-8

    steps:
      - name: 解析报告模式
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "10 0 * * 1-5")
                echo "mode=premarket" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                ;;
              "10 4 * * 1-5")
                echo "mode=midday" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                ;;
              "10 8 * * 1-5")
                echo "mode=aftermarket" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::notice::跳过非白名单定时触发：${{ github.event.schedule }}"
                echo "mode=skip" >> "$GITHUB_OUTPUT"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: 拉取代码
        if: steps.mode.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: 设置 Python
        if: steps.mode.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查 Secrets
        if: steps.mode.outputs.skip != 'true'
        run: |
          test -n "$A_SHARE_REPORT_TO" || { echo "缺少 A_SHARE_REPORT_TO"; exit 1; }
          test -n "$QQ_SMTP_USER" || { echo "缺少 QQ_SMTP_USER"; exit 1; }
          test -n "$QQ_SMTP_AUTH_CODE" || { echo "缺少 QQ_SMTP_AUTH_CODE"; exit 1; }

      - name: 检查脚本与模板
        if: steps.mode.outputs.skip != 'true'
        run: |
          test -f scripts/cloud_a_share_radar_email.py || { echo "未找到 scripts/cloud_a_share_radar_email.py"; exit 1; }
          test -f a-share-report-site/index.html || { echo "未找到 a-share-report-site/index.html"; exit 1; }

      - name: 生成并发送邮件
        if: steps.mode.outputs.skip != 'true'
        run: |
          python scripts/cloud_a_share_radar_email.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --template-html "a-share-report-site/index.html" \
            --output-html "radar-email-preview.html" \
            --send

      - name: 上传邮件预览
        if: always() && steps.mode.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-email-preview
          path: radar-email-preview.html
          if-no-files-found: ignore
