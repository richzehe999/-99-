name: A-share radar Feishu notification

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00 — 盘前
    - cron: "0 0 * * 1-5"
    # 北京时间 12:10 = UTC 04:10 — 午间
    - cron: "10 4 * * 1-5"
    # 北京时间 16:20 = UTC 08:20 — 盘后
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "报告模式"
        required: true
        default: "premarket"
        type: choice
        options:
          - premarket
          - midday
          - aftermarket
      date:
        description: "日期覆写（可选），例如 2026-05-15 08:00"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install akshare

      - name: 确定运行模式
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ='Asia/Shanghai' date +%H)
            if [ "$HOUR" -lt 10 ]; then
              echo "value=premarket" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" -lt 14 ]; then
              echo "value=midday" >> "$GITHUB_OUTPUT"
            else
              echo "value=aftermarket" >> "$GITHUB_OUTPUT"
            fi
            echo "date=" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成HTML报告
        run: |
          DATE_ARG=""
          if [[ -n "${{ steps.mode.outputs.date }}" ]]; then
            DATE_ARG="--date \"${{ steps.mode.outputs.date }}\""
          fi
          python3 scripts/generate_html_report.py --mode ${{ steps.mode.outputs.value }} $DATE_ARG --output a-share-report-site/index.html
          python3 scripts/generate_html_report.py --mode ${{ steps.mode.outputs.value }} $DATE_ARG --output index.html

      - name: 提交并推送HTML报告
        run: |
          git config user.name "a-share-radar-bot"
          git config user.email "bot@github.com"
          git add a-share-report-site/index.html index.html
          git diff --cached --quiet || git commit -m "auto: update radar report $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase --autostash origin main || true
          git push origin main

      - name: 推送飞书
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          DATE_ARG=""
          if [[ -n "${{ steps.mode.outputs.date }}" ]]; then
            DATE_ARG="--date \"${{ steps.mode.outputs.date }}\""
          fi
          python3 scripts/feishu_radar_notify.py --mode ${{ steps.mode.outputs.value }} $DATE_ARG

      - name: 告警：工作流执行失败
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          MODE="${{ steps.mode.outputs.value }}"
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          curl -s -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"config\": {\"wide_screen_mode\": true},
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"⚠️ A股雷达推送失败\",
                  \"template\": \"red\"
                },
                \"elements\": [
                  {\"tag\": \"div\", \"text\": {\"tag\": \"lark_md\", \"content\": \"**模式**：${MODE}\n**时间**：${TIMESTAMP}\n**仓库**：${{ github.repository }}\n**运行ID**：${{ github.run_id }}\n\n请检查 [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 日志排查原因。\"}},
                  {\"tag\": \"hr\"},
                  {\"tag\": \"note\", \"elements\": [{\"tag\": \"plain_text\", \"content\": \"A-share radar 自动告警 | 数据源或脚本异常\"}]}
                ]
              }
            }"
